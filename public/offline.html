<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b0124f" />
    <title>Hors connexion · Grenier Communautaire</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f7; color: #1a1a2e;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 380px; }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { font-size: 1.4rem; margin: 20px 0 8px; }
      p { color: #6b6b80; line-height: 1.5; margin: 0 0 24px; }
      button { background: #b0124f; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Vous êtes hors connexion</h1>
      <p>Vérifiez votre connexion internet. Vos demandes et vos messages seront de nouveau accessibles dès qu'elle sera rétablie.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
    <script>
      // Recharge automatiquement dès le retour du réseau.
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
